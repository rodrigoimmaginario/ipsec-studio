        <span class="pill" data-i18n="hero.pill"></span>
        <h1 id="hero-title"></h1>
        <p class="hero-lead" id="hero-lead"></p>
        <p class="hero-sub" id="hero-text"></p>
        <div class="ctas">
          <a class="btn primary" id="cta-download" href="https://github.com/rodrigoimmaginario/ipsec-studio/releases/latest" data-i18n="cta.download"></a>

        </div>
        <ul class="facts" id="facts"></ul>
      </div>
      <div class="hero-art">

        <span class="chip c-ref" aria-hidden="true"><b>✕</b><span data-i18n="chips.refused"></span><small data-i18n="chips.refusedSub"></small></span>
        <span class="chip c-bnd" aria-hidden="true"><b>↺</b><span data-i18n="chips.rollback"></span></span>

      <div class="head">
        <p class="eyebrow" data-i18n="how.eyebrow"></p>
        <h2 data-i18n="how.title"></h2>
        <p class="lead" data-i18n="how.intro"></p>
      </div>
      <div class="story">
        <div class="pin"><div class="diagram" id="diagram" role="img"></div></div>
        <div class="scenes" id="scenes"></div>
      </div>

        <p class="eyebrow" data-i18n="protects.eyebrow"></p>
        <h2 data-i18n="protects.title"></h2>
        <p class="lead" data-i18n="protects.intro"></p>

        <article class="tile featured" id="protect-featured"></article>
        <ul class="tiles" id="protect-items"></ul>
      </div>
      <div class="limits"><b data-i18n="protects.limits.title"></b><p data-i18n="protects.limits.text"></p></div>
    </section>

    <section class="benefits" id="beneficios">
      <div class="head">
        <p class="eyebrow" data-i18n="benefits.eyebrow"></p>
        <h2 data-i18n="benefits.title"></h2>
      </div>
      <ul class="benefit-list" id="benefit-items"></ul>
    </section>

      <div class="why-grid">

          <p class="lead" data-i18n="why.intro"></p>
          <div class="art" id="why-art" aria-hidden="true"></div>
        </div>
        <ul class="fears" id="why-items"></ul>
      </div>

      <div class="head">
        <p class="eyebrow" data-i18n="steps.eyebrow"></p>

        <p class="lead" data-i18n="steps.intro"></p>
      </div>
      <div class="steps-body">
        <ol class="step-texts" id="step-texts"></ol>
        <div class="pin">
          <figure class="window big">
            <div class="wbar"><i></i><i></i><i></i><span id="shot-label"></span></div>
            <div class="zoom" id="shots"></div>
            <figcaption data-i18n="steps.sample"></figcaption>
          </figure>
        </div>
      </div>

          <div class="art" id="origin-art" aria-hidden="true"></div>

      <div class="head">
        <p class="eyebrow" data-i18n="download.eyebrow"></p>
        <h2 data-i18n="download.title"></h2>
      </div>
      <div class="download-grid">
        <div class="tile">
          <h3 data-i18n="download.requirementsTitle"></h3>
          <ul class="checks" id="req-items"></ul>
          <p class="verify-text" data-i18n="download.verify"></p>
          <code class="verify" data-i18n="download.verifyCmd"></code>

            <a class="btn primary" id="dl-release" href="#" data-i18n="download.release"></a>
            <a class="btn soft" id="dl-install" href="#" data-i18n="download.install"></a>

          <p><a class="more" id="dl-contribute" href="#" data-i18n="download.contributeLink"></a> · <span data-i18n="download.license"></span></p>
        </div>
      </div>
